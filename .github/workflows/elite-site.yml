name: Warhorse Roofing design and public release checks
on:
  push:
    branches:
      - qa/warhorse-fieldwork-20261122
permissions: {}
jobs:
  browser:
    name: Desktop and mobile site checks
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Playwright for local Chrome
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/roofing-browser" --no-audit --no-fund --ignore-scripts playwright@1.55.0
      - name: Check the ten pages in Chrome
        shell: bash
        run: |
          export QA_BROWSER_MODULE="$RUNNER_TEMP/roofing-browser/node_modules/playwright"
          export QA_CHROME="$(command -v google-chrome || command -v google-chrome-stable)"
          export QA_DIST="$GITHUB_WORKSPACE/dist"
          node qa/qa.cjs
      - name: Save homepage screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roofing-homepage-screenshots
          path: qa/qa-home-*.jpg
          retention-days: 1
          if-no-files-found: ignore
      - name: Prepare visual review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'from PIL import Image' || python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from urllib.request import Request, urlopen
          import base64, io, json, os
          wide=Image.open('qa/qa-home-1440.jpg').convert('RGB')
          narrow=Image.open('qa/qa-home-390.jpg').convert('RGB')
          wide=wide.crop((0,0,wide.width,min(wide.height,2800)))
          wide.thumbnail((740,1500))
          narrow=narrow.crop((0,0,narrow.width,min(narrow.height,2200)))
          narrow.thumbnail((220,1400))
          montage=Image.new('RGB',(wide.width+narrow.width+5,max(wide.height,narrow.height)), '#d3d3d3')
          montage.paste(wide,(0,0))
          montage.paste(narrow,(wide.width+5,0))
          data=io.BytesIO(); montage.save(data,format='JPEG',quality=72,optimize=True)
          url=os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs'
          payload={'encoding':'utf-8','content':base64.b64encode(data.getvalue()).decode()}
          req=Request(url,data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          with urlopen(req,timeout=20) as r: sha=json.load(r)['sha']
          Path('qa/review-id.txt').write_text(sha)
          with open(os.environ['GITHUB_ENV'],'a') as out: print('REVIEW_SHA='+sha,file=out)
          PY
      - name: Index the review image
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-${{ env.REVIEW_SHA }}
          path: qa/review-id.txt
          retention-days: 1
  live:
    name: Check the ten published pages and their release assets
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compare the public domain with the release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          from urllib.request import Request, urlopen
          from urllib.error import URLError
          import os, time
          root=Path('dist')
          resources=sorted(root.rglob('*.html')) + [root / p for p in ('assets/editorial.css','photo-viewer.js','estimate.js','contact.css','assets/wyoming-projects-map.svg','assets/riverton-spray-pass.webp','assets/jackson-roof-finish.webp','assets/fonts/instrument-serif-italic.ttf')]
          def check(p):
              route=p.relative_to(root).as_posix().removesuffix('index.html')
              target='https://warhorse-roofing.com/'+route+'?release='+os.environ['GITHUB_SHA'][:12]
              req=Request(target,headers={'User-Agent':'WarhorseRoofingReleaseCheck/1.0','Cache-Control':'no-cache'})
              with urlopen(req,timeout=10) as res:
                  if res.status!=200 or res.read()!=p.read_bytes(): raise ValueError('Waiting for '+str(p))
          for attempt in range(45):
              try:
                  with ThreadPoolExecutor(6) as pool: list(pool.map(check,resources))
                  print('Matched '+str(len(resources))+' production files, including all ten pages.')
                  break
              except (URLError,ValueError,OSError) as exc:
                  if attempt==44: raise
                  print(exc,flush=True)
                  time.sleep(8)
          PY
