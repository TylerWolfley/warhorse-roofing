name: Candidate roofing site checks
on:
  push:
    branches:
      - qa/wrr-layout-20261122
permissions: {}
jobs:
  browser:
    name: Desktop and mobile site checks
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Playwright for local Chrome
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/roofing-browser" --no-audit --no-fund --ignore-scripts playwright@1.55.0
      - name: Check the nine pages in Chrome
        shell: bash
        run: |
          export QA_BROWSER_MODULE="$RUNNER_TEMP/roofing-browser/node_modules/playwright"
          export QA_CHROME="$(command -v google-chrome || command -v google-chrome-stable)"
          export QA_DIST="$GITHUB_WORKSPACE/dist"
          node qa/qa.cjs
      - name: Save homepage screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roofing-homepage-screenshots
          path: qa/qa-home-*.jpg
          retention-days: 1
          if-no-files-found: ignore
      - name: Prepare visual review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c 'from PIL import Image' || python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from urllib.request import Request, urlopen
          import base64, io, json, os
          wide=Image.open('qa/qa-home-1440.jpg').convert('RGB')
          narrow=Image.open('qa/qa-home-390.jpg').convert('RGB')
          wide.thumbnail((680,1500))
          narrow=narrow.crop((0,0,narrow.width,min(narrow.height,2650)))
          narrow.thumbnail((205,1450))
          montage=Image.new('RGB',(wide.width+narrow.width+5,max(wide.height,narrow.height)), '#d3d3d3')
          montage.paste(wide,(0,0))
          montage.paste(narrow,(wide.width+5,0))
          data=io.BytesIO(); montage.save(data,format='JPEG',quality=72,optimize=True)
          url=os.environ['GITHUB_API_URL']+'/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs'
          payload={'encoding':'utf-8','content':base64.b64encode(data.getvalue()).decode()}
          req=Request(url,data=json.dumps(payload).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json','Accept':'application/vnd.github+json'})
          with urlopen(req,timeout=20) as r: sha=json.load(r)['sha']
          Path('qa/review-id.txt').write_text(sha)
          with open(os.environ['GITHUB_ENV'],'a') as out: print('REVIEW_SHA='+sha,file=out)
          PY
      - name: Index the review image
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-${{ env.REVIEW_SHA }}
          path: qa/review-id.txt
          retention-days: 1
  live:
    name: Verify the public domain after deployment
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check the new homepage, service area and project gallery
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          from urllib.request import Request,urlopen
          from urllib.error import URLError
          base='https://warhorse-roofing.com/'
          expected={'':'crew-metal-panels.webp','service-area/':'Commercial roofing across Wyoming','projects/':'gallery-riverton','contact/':'assessment-help'}
          for attempt in range(26):
              try:
                  for route,marker in expected.items():
                      r=Request(base+route+'?release=wrr-20261122',headers={'User-Agent':'WarHorseReleaseCheck/1.0','Cache-Control':'no-cache'})
                      with urlopen(r,timeout=8) as res:
                          if res.status!=200 or marker not in res.read().decode(): raise ValueError('New release not available at '+route)
                  print('Custom domain returned the updated home, service area, photo gallery and contact pages over HTTPS.')
                  break
              except (URLError,ValueError,OSError) as err:
                  if attempt==25: raise
                  print(str(err)[:150], flush=True)
                  time.sleep(5)
          PY
